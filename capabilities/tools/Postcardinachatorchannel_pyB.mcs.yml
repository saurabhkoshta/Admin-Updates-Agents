mcs.metadata:
  componentName: Post weekly admin digest card
  description: Posts the Admin Updates Agent weekly digest as an Adaptive Card to the Teams channel configured on the current subscription. Use this for Teams digest delivery instead of the plain message tool.
kind: ConnectorTool
authMode: Invoker
connectionReference: sample_adminupdatesagent.cr.shared_teams
connectorId: /providers/Microsoft.PowerApps/apis/shared_teams
operationId: PostCardToConversation
toolInputs:
  - name: poster
    description: Always post as the Flow bot for unattended weekly digest delivery.

  - name: location
    description: Always post in a Microsoft Teams channel. Use only the Team and channel stored on the current subscription row.