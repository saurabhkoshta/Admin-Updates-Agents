mcs.metadata:
  componentName: Update my admin digest subscription
  description: Updates or disables the signed-in user's existing Admin Digest Subscription row after the user confirms the requested changes. Never changes owner or last-delivery columns.
kind: ConnectorTool
authMode: Invoker
connectionReference: sample_adminupdatesagent.cr.shared_commondataserviceforapps
connectorId: /providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps
operationId: UpdateOnlyRecordWithOrganization
toolInputs:
  - name: organization
    description: Use the current Power Platform environment that contains this imported agent and its solution. Never use or request an environment GUID.

  - name: entityName
    fixedValue: ="sample_admindigestsubscriptions"

  - name: recordId
    description: Use only the row ID returned by Get admin digest subscriptions in the current conversation. That tool returns only the signed-in user's rows. Never accept a user-supplied row ID.