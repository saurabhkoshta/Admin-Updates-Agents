mcs.metadata:
  componentName: Get admin digest subscriptions
  description: Retrieves the signed-in administrator's own Admin Digest Subscription rows. The table, owner filter, and columns are fixed, so it never returns another user's subscription.
kind: ConnectorTool
authMode: Invoker
connectionReference: sample_adminupdatesagent.cr.shared_commondataserviceforapps
connectorId: /providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps
operationId: ListRecordsWithOrganization
toolInputs:
  - name: organization
    description: Use the current Power Platform environment that contains this imported agent and its solution. Never use or request an environment GUID.

  - name: entityName
    fixedValue: ="sample_admindigestsubscriptions"

  - name: $select
    fixedValue: ="sample_admindigestsubscriptionid,sample_newcolumn,sample_selectedproducts,sample_teamsenabled,sample_teamsteamid,sample_teamschannelid,sample_teamschannelname,sample_emailenabled,sample_emailrecipients,sample_scheduleday,sample_scheduletime,sample_timezone,sample_active,sample_lastdeliveryat,sample_lastdeliverystatus"

  - name: $filter
    fixedValue: ="owninguser/azureactivedirectoryobjectid eq " & System.User.Id

  - name: $top
    fixedValue: =10
