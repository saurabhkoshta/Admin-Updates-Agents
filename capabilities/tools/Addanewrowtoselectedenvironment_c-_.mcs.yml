mcs.metadata:
  componentName: Create my admin digest subscription
  description: Creates one Admin Digest Subscription row owned by the signed-in user in the current environment. Use only after the user confirms the preferences. Never set owner or last-delivery columns.
kind: ConnectorTool
authMode: Invoker
connectionReference: sample_adminupdatesagent.cr.shared_commondataserviceforapps
connectorId: /providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps
operationId: CreateRecordWithOrganization
toolInputs:
  - name: organization
    description: Use the current Power Platform environment that contains this imported agent and its solution. Never use or request an environment GUID.

  - name: entityName
    fixedValue: ="sample_admindigestsubscriptions"